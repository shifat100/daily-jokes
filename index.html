<style>
  /* ============================================================
     THEMES
     ============================================================ */
  :root[data-theme="light"] {
    --bg: #f8fafc; --surface: #ffffff; --surface-hover: #f1f5f9;
    --border: #e2e8f0; --border-strong: #cbd5e1;
    --text: #0f172a; --text-secondary: #475569; --text-muted: #94a3b8;
    --accent: #2563eb; --accent-bg: #eff6ff;
    --success: #059669; --success-bg: #ecfdf5;
    --shadow: 0 4px 6px -1px rgba(0,0,0,0.04), 0 2px 4px -2px rgba(0,0,0,0.03);
  }
  :root[data-theme="dark"] {
    --bg: #090d16; --surface: #111827; --surface-hover: #1f2937;
    --border: #1f2937; --border-strong: #374151;
    --text: #f9fafb; --text-secondary: #9ca3af; --text-muted: #6b7280;
    --accent: #38bdf8; --accent-bg: #0369a133;
    --success: #10b981; --success-bg: #064e3b33;
    --shadow: 0 4px 12px rgba(0,0,0,0.3);
  }
  :root[data-theme="sepia"] {
    --bg: #fbf7ee; --surface: #f4ecd8; --surface-hover: #ede3ca;
    --border: #e6dac1; --border-strong: #d5c39f;
    --text: #433422; --text-secondary: #705e46; --text-muted: #9d8c74;
    --accent: #b45309; --accent-bg: #fef3c7;
    --success: #059669; --success-bg: #ecfdf5;
    --shadow: 0 4px 6px rgba(67,52,34,0.05);
  }
  :root[data-theme="midnight"] {
    --bg: #0b0f19; --surface: #151d30; --surface-hover: #1e2942;
    --border: #222f4c; --border-strong: #334469;
    --text: #e2e8f0; --text-secondary: #94a3b8; --text-muted: #64748b;
    --accent: #818cf8; --accent-bg: #312e8144;
    --success: #10b981; --success-bg: #064e3b33;
    --shadow: 0 4px 14px rgba(0,0,0,0.4);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.6;
    min-height: 100vh; display: flex; flex-direction: column;
    transition: background .2s ease, color .2s ease;
  }

  /* HEADER */
  .header {
    background: var(--surface); border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 100; backdrop-filter: blur(8px);
  }
  .header-inner {
    max-width: 820px; margin: 0 auto; padding: .75rem 1.25rem;
    display: flex; align-items: center; justify-content: space-between; gap: .75rem;
  }
  .brand { display: flex; align-items: center; gap: .65rem; text-decoration: none; color: inherit; }
  .brand-icon {
    width: 32px; height: 32px; border-radius: 8px; background: var(--text);
    color: var(--surface); display: flex; align-items: center; justify-content: center;
  }
  .brand-title { font-size: 1.05rem; font-weight: 700; letter-spacing: -.02em; }

  .header-controls { display: flex; align-items: center; gap: .5rem; }
  .theme-box { display: flex; align-items: center; gap: .35rem; }
  .theme-select {
    padding: .35rem .6rem; border: 1px solid var(--border); border-radius: 8px;
    background: var(--surface); color: var(--text); font: inherit; font-size: .75rem;
    font-weight: 500; cursor: pointer; outline: none;
  }

  /* FIRST-TIMER RECOMMENDATION BANNER */
  .rec-banner {
    background: var(--accent-bg); border-bottom: 1px solid var(--border);
    padding: .75rem 1.25rem; display: none; align-items: center; justify-content: center;
    gap: .75rem; font-size: .8125rem; color: var(--text); animation: fadeIn .3s ease;
  }
  .rec-banner.show { display: flex; flex-wrap: wrap; }
  .rec-banner-content { display: flex; align-items: center; gap: .5rem; }
  .rec-btn {
    padding: .3rem .75rem; border-radius: 6px; font: inherit; font-size: .75rem;
    font-weight: 600; cursor: pointer; border: none; transition: all .15s;
  }
  .rec-btn-primary { background: var(--accent); color: #fff; }
  .rec-btn-dismiss { background: transparent; color: var(--text-muted); }

  /* TOOLBAR (SEARCH + LANGUAGE CHIPS) */
  .toolbar {
    max-width: 820px; width: 100%; margin: 1.25rem auto 0; padding: 0 1.25rem;
    display: flex; flex-direction: column; gap: .75rem;
  }
  .search-wrap { position: relative; width: 100%; }
  .search-icon {
    position: absolute; left: 1rem; top: 50%; transform: translateY(-50%);
    color: var(--text-muted); pointer-events: none;
  }
  .search-input {
    width: 100%; padding: .75rem 1rem .75rem 2.6rem; border: 1px solid var(--border);
    background: var(--surface); border-radius: 12px; font: inherit; font-size: .9375rem;
    color: var(--text); outline: none; box-shadow: var(--shadow); transition: all .15s;
  }
  .search-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-bg); }

  .lang-bar {
    display: flex; gap: .4rem; overflow-x: auto; scrollbar-width: none;
    padding-bottom: .25rem;
  }
  .lang-bar::-webkit-scrollbar { display: none; }
  .lang-chip {
    display: inline-flex; align-items: center; gap: .45rem; padding: .4rem .85rem;
    background: var(--surface); border: 1px solid var(--border); border-radius: 999px;
    font-size: .8125rem; font-weight: 500; color: var(--text-secondary);
    cursor: pointer; white-space: nowrap; transition: all .15s; user-select: none;
  }
  .lang-chip:hover { background: var(--surface-hover); color: var(--text); }
  .lang-chip.active { background: var(--text); color: var(--surface); border-color: var(--text); }
  .lang-chip svg { flex-shrink: 0; }

  /* FEED CONTAINER */
  .feed {
    max-width: 820px; width: 100%; margin: 1rem auto; padding: 0 1.25rem 4rem;
    display: flex; flex-direction: column; gap: 1.25rem; flex: 1;
  }

  /* JOKE CARD */
  .joke-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
    box-shadow: var(--shadow); padding: 1.5rem 1.75rem; display: flex; flex-direction: column;
    gap: 1.25rem; transition: transform .15s ease, box-shadow .15s ease;
    animation: fadeIn .3s ease;
  }
  .joke-card:hover { transform: translateY(-2px); }
  .card-top { display: flex; align-items: center; justify-content: space-between; }
  .lang-badge {
    font-size: .6875rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em;
    padding: .25rem .55rem; border-radius: 6px; background: var(--bg); color: var(--text-secondary);
    border: 1px solid var(--border); display: inline-flex; align-items: center; gap: .3rem;
  }
  .card-actions { display: flex; align-items: center; gap: .45rem; }
  .icon-btn {
    width: 32px; height: 32px; border: 1px solid var(--border); background: var(--surface);
    border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    color: var(--text-secondary); transition: all .15s;
  }
  .icon-btn:hover { background: var(--surface-hover); color: var(--text); }
  .icon-btn.copied { color: var(--success); border-color: var(--success); background: var(--success-bg); }

  .joke-text {
    font-family: 'Lora', Georgia, serif; font-size: 1.15rem; line-height: 1.8;
    color: var(--text); white-space: pre-wrap; word-break: break-word;
  }
  .highlight { background: #fef08a; color: #1c1917; padding: 0 3px; border-radius: 3px; }

  /* SKELETON LOADERS */
  .skeleton-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
    padding: 1.75rem; display: flex; flex-direction: column; gap: 1rem;
  }
  .sk-line {
    height: 14px; background: linear-gradient(90deg, var(--surface-hover) 0%, var(--border) 50%, var(--surface-hover) 100%);
    background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 4px;
  }
  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  .empty-state { text-align: center; padding: 3.5rem 1rem; color: var(--text-muted); }
  .empty-state h3 { font-size: 1.05rem; color: var(--text-secondary); margin-bottom: .4rem; }

  /* SCROLL TO TOP FAB */
  .fab-top {
    position: fixed; bottom: 20px; right: 20px; width: 44px; height: 44px;
    background: var(--surface); color: var(--text); border: 1px solid var(--border);
    border-radius: 50%; box-shadow: var(--shadow); cursor: pointer;
    display: none; align-items: center; justify-content: center; transition: all .2s; z-index: 90;
  }
  .fab-top.visible { display: flex; }
  .fab-top:hover { transform: scale(1.08); }

  /* FOOTER */
  .footer {
    margin-top: auto; border-top: 1px solid var(--border); background: var(--surface);
    padding: 1.5rem 1.25rem; text-align: center; font-size: .75rem; color: var(--text-muted);
  }
  .footer a { color: var(--text-secondary); text-decoration: none; margin: 0 .4rem; }
  .footer a:hover { text-decoration: underline; }
</style>
</head>

<script>
  // ============================================================
  // CONFIGURATION
  // ============================================================
  const GITHUB_REPO = "shifat100/daily-jokes";
  const BRANCH = "main";
  const DATA_ROOT = "data";
  const BATCH_SIZE = 8;
  const SITE_URL = "https://shifat100.github.io/daily-jokes/";

  // Clean English Display Names
  const LANG_NAMES = {
    "en": "English", "bn": "Bengali", "hi": "Hindi", "ar": "Arabic",
    "es": "Spanish", "fr": "French", "de": "German", "ja": "Japanese",
    "zh": "Chinese", "ru": "Russian", "pt": "Portuguese", "ur": "Urdu"
  };

  // Reusable inline SVG globe string for language chips
  const SVG_GLOBE = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>`;

  // ============================================================
  // APP STATE
  // ============================================================
  let availableLangs = [];
  let currentLang = "en";
  let jokeManifest = [];
  let loadedJokes = [];
  let renderPointer = 0;
  let isFetching = false;
  let activeSearchQuery = "";

  const feedContainer = document.getElementById("feedContainer");
  const langTabs = document.getElementById("langTabs");
  const searchBox = document.getElementById("searchBox");
  const themeSelect = document.getElementById("themeSelect");
  const recBanner = document.getElementById("recBanner");
  const scrollTopBtn = document.getElementById("scrollTopBtn");

  document.getElementById("currentYear").textContent = new Date().getFullYear();

  // ============================================================
  // THEME MANAGEMENT
  // ============================================================
  const savedTheme = localStorage.getItem("jokes_theme") || "light";
  document.documentElement.setAttribute("data-theme", savedTheme);
  themeSelect.value = savedTheme;

  themeSelect.addEventListener("change", (e) => {
    const val = e.target.value;
    document.documentElement.setAttribute("data-theme", val);
    localStorage.setItem("jokes_theme", val);
  });

  // ============================================================
  // UTILITIES
  // ============================================================
  function esc(s) {
    return (s || "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" })[c]);
  }

  function stripMeta(text) {
    const lines = text.split("\n");
    let start = 0;
    for (let i = 0; i < Math.min(lines.length, 12); i++) {
      const l = lines[i].trim();
      if (l === "" || l.startsWith("---") || /^(language|date|category|title|author|source)\s*:/i.test(l)) start = i + 1;
      else break;
    }
    return lines.slice(start).join("\n").trim() || text.trim();
  }

  function getLangLabel(code) {
    const p = code.split("-")[0].toLowerCase();
    return LANG_NAMES[p] || code.toUpperCase();
  }

  // ============================================================
  // SEO DYNAMIC UPDATES
  // ============================================================
  function updateSEOData(langName) {
    const title = `${langName} Jokes Feed — Daily Clean & Funny Quotes`;
    const desc = `Read the best bite-sized ${langName} jokes in an endless stream. Updated daily with instant keyword search.`;
    document.title = title;

    const setM = (sel, attr, val) => {
      const el = document.querySelector(sel);
      if (el) el.setAttribute(attr, val);
    };

    setM('meta[name="description"]', "content", desc);
    setM('#ogTitle', "content", title);
    setM('#ogDesc', "content", desc);
    setM('#twTitle', "content", title);
    setM('#twDesc', "content", desc);

    const shareUrl = `${SITE_URL}?lang=${currentLang}`;
    setM('#canonicalUrl', "href", shareUrl);
    setM('#ogUrl', "content", shareUrl);

    if (window.history && window.history.replaceState) {
      window.history.replaceState(null, title, shareUrl);
    }
  }

  // ============================================================
  // FIRST TIMER DETECTION & SMART RECOMMENDATION
  // ============================================================
  function checkFirstTimer(available) {
    const alreadyDecided = localStorage.getItem("jokes_lang_decided");
    if (alreadyDecided) return;

    const userLangs = navigator.languages || [navigator.language || ""];
    let matchedCode = null;

    for (let u of userLangs) {
      const primary = u.split("-")[0].toLowerCase();
      const match = available.find(a => a.toLowerCase().startsWith(primary));
      if (match) {
        matchedCode = match;
        break;
      }
    }

    if (matchedCode && matchedCode.split("-")[0] !== "en") {
      const langName = getLangLabel(matchedCode);
      document.getElementById("recText").innerHTML =
        `We noticed your preferred language is <strong>${esc(langName)}</strong>. Switch to ${esc(langName)} jokes?`;
      recBanner.classList.add("show");

      document.getElementById("recAcceptBtn").onclick = () => {
        localStorage.setItem("jokes_lang_decided", "true");
        recBanner.classList.remove("show");
        switchLanguage(matchedCode);
      };

      document.getElementById("recDismissBtn").onclick = () => {
        localStorage.setItem("jokes_lang_decided", "true");
        recBanner.classList.remove("show");
      };
    }
  }

  // ============================================================
  // LOAD LANGUAGES
  // ============================================================
  async function initLanguages() {
    try {
      let langs = [];
      if (GITHUB_REPO) {
        const r = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/contents/${DATA_ROOT}?ref=${BRANCH}`);
        if (r.ok) {
          const json = await r.json();
          langs = json.filter(i => i.type === "dir" && !i.name.startsWith(".")).map(i => i.name);
        }
      }

      if (!langs.length) {
        const r = await fetch(`${DATA_ROOT}/languages.json`, { cache: "no-store" });
        if (r.ok) {
          const json = await r.json();
          langs = (json.languages || []).map(l => typeof l === "string" ? l : l.code);
        }
      }

      availableLangs = langs.length ? langs : ["en"];
      renderLangBar();

      const urlParam = new URLSearchParams(location.search).get("lang");
      if (urlParam && availableLangs.includes(urlParam)) {
        currentLang = urlParam;
      } else {
        currentLang = availableLangs.includes("en") ? "en" : availableLangs[0];
      }

      checkFirstTimer(availableLangs);
      switchLanguage(currentLang);
    } catch (e) {
      feedContainer.innerHTML = `<div class="empty-state"><h3>Unable to load jokes</h3><p>${esc(e.message)}</p></div>`;
    }
  }

  function renderLangBar() {
    langTabs.innerHTML = availableLangs.map(code => `
      <button class="lang-chip ${code === currentLang ? "active" : ""}" data-code="${esc(code)}">
        ${SVG_GLOBE}
        <span>${esc(getLangLabel(code))}</span>
      </button>
    `).join("");

    langTabs.querySelectorAll(".lang-chip").forEach(btn => {
      btn.onclick = () => switchLanguage(btn.dataset.code);
    });
  }

  // ============================================================
  // SWITCH LANGUAGE
  // ============================================================
  async function switchLanguage(lang) {
    currentLang = lang;
    renderLangBar();
    updateSEOData(getLangLabel(lang));

    jokeManifest = [];
    loadedJokes = [];
    renderPointer = 0;
    searchBox.value = "";
    activeSearchQuery = "";

    feedContainer.innerHTML = `
      <div class="skeleton-card"><div class="sk-line" style="width:25%;"></div><div class="sk-line" style="width:90%;"></div><div class="sk-line" style="width:75%;"></div></div>
      <div class="skeleton-card"><div class="sk-line" style="width:20%;"></div><div class="sk-line" style="width:95%;"></div><div class="sk-line" style="width:80%;"></div></div>
    `;

    try {
      if (GITHUB_REPO) {
        const r = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/contents/${DATA_ROOT}/${lang}?ref=${BRANCH}`);
        if (r.ok) {
          const files = await r.json();
          jokeManifest = files.filter(f => f.name.endsWith(".txt")).map(f => ({ name: f.name, url: f.download_url }));
        }
      }
      if (!jokeManifest.length) {
        const r = await fetch(`${DATA_ROOT}/${lang}/manifest.json`, { cache: "no-store" });
        if (r.ok) {
          const json = await r.json();
          jokeManifest = (json.files || []).map(f => ({ name: f, url: `${DATA_ROOT}/${lang}/${f}` }));
        }
      }
    } catch (_) {}

    jokeManifest.sort((a, b) => b.name.localeCompare(a.name));

    if (!jokeManifest.length) {
      feedContainer.innerHTML = `
        <div class="empty-state">
          <h3>No jokes found</h3>
          <p>No joke files found in the ${esc(getLangLabel(lang))} directory.</p>
        </div>`;
      return;
    }

    feedContainer.innerHTML = "";
    await loadNextBatch();
  }

  // ============================================================
  // ASYNC BATCH LOADER
  // ============================================================
  async function loadNextBatch() {
    if (isFetching || renderPointer >= jokeManifest.length) return;
    isFetching = true;

    const slice = jokeManifest.slice(renderPointer, renderPointer + BATCH_SIZE);
    renderPointer += BATCH_SIZE;

    const promises = slice.map(async (file) => {
      try {
        const res = await fetch(file.url, { cache: "no-store" });
        if (!res.ok) return null;
        const raw = await res.text();
        const body = stripMeta(raw);
        return { id: file.name, body, raw };
      } catch {
        return null;
      }
    });

    const results = (await Promise.all(promises)).filter(Boolean);
    loadedJokes.push(...results);
    appendJokesToDOM(results);
    isFetching = false;
  }

  // ============================================================
  // RENDER JOKES (100% SVG ICONS)
  // ============================================================
  function appendJokesToDOM(jokesList) {
    if (!jokesList.length && !feedContainer.children.length) {
      feedContainer.innerHTML = `<div class="empty-state"><h3>No jokes available</h3></div>`;
      return;
    }
    jokesList.forEach(joke => {
      const card = createJokeCard(joke);
      feedContainer.appendChild(card);
    });
  }

  function createJokeCard(joke) {
    const card = document.createElement("article");
    card.className = "joke-card";
    card.dataset.id = joke.id;

    let displayBody = esc(joke.body);
    if (activeSearchQuery) {
      const regex = new RegExp(`(${activeSearchQuery})`, "gi");
      displayBody = displayBody.replace(regex, `<mark class="highlight">$1</mark>`);
    }

    card.innerHTML = `
      <div class="card-top">
        <span class="lang-badge">
          ${SVG_GLOBE}
          ${esc(getLangLabel(currentLang))}
        </span>
        <div class="card-actions">
          <!-- SVG Copy Icon -->
          <button class="icon-btn copy-btn" title="Copy Joke" aria-label="Copy Joke">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
            </svg>
          </button>
          <!-- SVG Share Icon -->
          <button class="icon-btn share-btn" title="Share Joke" aria-label="Share Joke">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
              <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
            </svg>
          </button>
        </div>
      </div>
      <p class="joke-text">${displayBody}</p>
    `;

    // Copy Action with SVG Checkmark
    const copyBtn = card.querySelector(".copy-btn");
    copyBtn.onclick = () => {
      navigator.clipboard.writeText(joke.body).then(() => {
        copyBtn.classList.add("copied");
        copyBtn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>`;
        setTimeout(() => {
          copyBtn.classList.remove("copied");
          copyBtn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`;
        }, 1500);
      });
    };

    // Share Action
    const shareBtn = card.querySelector(".share-btn");
    shareBtn.onclick = () => {
      const shareText = `${joke.body}\n\nRead more at: ${SITE_URL}`;
      if (navigator.share) {
        navigator.share({ title: "Daily Joke", text: shareText, url: SITE_URL }).catch(() => {});
      } else {
        navigator.clipboard.writeText(shareText);
        alert("Joke copied to clipboard with website link!");
      }
    };

    return card;
  }

  // ============================================================
  // KEYWORD SEARCH FILTER
  // ============================================================
  searchBox.addEventListener("input", async (e) => {
    activeSearchQuery = e.target.value.trim().toLowerCase();

    if (activeSearchQuery.length >= 2 && renderPointer < jokeManifest.length) {
      while (renderPointer < jokeManifest.length) {
        await loadNextBatch();
      }
    }

    feedContainer.innerHTML = "";
    const filtered = loadedJokes.filter(j => j.body.toLowerCase().includes(activeSearchQuery));

    if (!filtered.length) {
      feedContainer.innerHTML = `
        <div class="empty-state">
          <h3>No matching jokes found</h3>
          <p>No results for "<strong>${esc(activeSearchQuery)}</strong>"</p>
        </div>`;
      return;
    }

    appendJokesToDOM(filtered);
  });

  // ============================================================
  // INFINITE SCROLL
  // ============================================================
  window.addEventListener("scroll", () => {
    if (window.scrollY > 400) scrollTopBtn.classList.add("visible");
    else scrollTopBtn.classList.remove("visible");

    if (!activeSearchQuery) {
      if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 500) {
        loadNextBatch();
      }
    }
  });

  scrollTopBtn.onclick = () => window.scrollTo({ top: 0, behavior: "smooth" });

  // RUN APP
  initLanguages();
</script>
</body>
</html>
