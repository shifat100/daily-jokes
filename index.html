<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Jokes — Multi-Language Collection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf9f6;
    --surface: #ffffff;
    --surface-hover: #f5f4f0;
    --border: #e7e5e4;
    --border-strong: #d6d3d1;
    --text: #1c1917;
    --text-secondary: #57534e;
    --text-muted: #a8a29e;
    --success: #059669;
    --success-bg: #ecfdf5;
    --success-border: #a7f3d0;
    --danger: #b91c1c;
    --radius: 8px;
    --radius-lg: 12px;
    --shadow-sm: 0 1px 2px rgba(28, 25, 23, 0.04);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.6;
    min-height: 100vh;
    font-feature-settings: 'cv02', 'cv03', 'cv04', 'cv11';
  }

  /* ============ HEADER ============ */
  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-inner {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0.75rem 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }
  .brand-icon {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    background: var(--text);
    color: var(--surface);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .brand-text h1 {
    font-size: 0.9375rem;
    font-weight: 600;
    letter-spacing: -0.01em;
    line-height: 1.2;
  }
  .brand-text p {
    font-size: 0.75rem;
    color: var(--text-muted);
    margin-top: 1px;
  }
  .header-stat {
    padding: 0.3125rem 0.6875rem;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 999px;
    font-size: 0.75rem;
    font-weight: 500;
    color: var(--text-secondary);
    font-variant-numeric: tabular-nums;
  }

  /* ============ LANGUAGE BAR ============ */
  .lang-bar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 56px;
    z-index: 99;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .lang-bar::-webkit-scrollbar { display: none; }
  .lang-bar-inner {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0.625rem 1.5rem;
    display: flex;
    gap: 0.25rem;
    min-width: max-content;
  }
  .lang-pill {
    display: inline-flex;
    align-items: center;
    gap: 0.4375rem;
    padding: 0.375rem 0.75rem;
    border: 1px solid transparent;
    background: transparent;
    border-radius: 7px;
    font: inherit;
    font-size: 0.8125rem;
    font-weight: 500;
    color: var(--text-secondary);
    cursor: pointer;
    transition: all 0.12s;
    white-space: nowrap;
  }
  .lang-pill:hover {
    background: var(--bg);
    color: var(--text);
  }
  .lang-pill.active {
    background: var(--text);
    color: var(--surface);
  }
  .lang-pill .flag { font-size: 0.9375rem; line-height: 1; }
  .lang-pill .num {
    font-size: 0.6875rem;
    font-variant-numeric: tabular-nums;
    padding: 0 0.375rem;
    background: rgba(0,0,0,0.06);
    border-radius: 4px;
    line-height: 1.5;
    margin-left: 0.125rem;
  }
  .lang-pill.active .num { background: rgba(255,255,255,0.18); }

  /* ============ LAYOUT ============ */
  .main {
    max-width: 1200px;
    margin: 0 auto;
    padding: 1.5rem;
    display: grid;
    grid-template-columns: 280px 1fr;
    gap: 1.5rem;
    align-items: start;
  }
  @media (max-width: 860px) {
    .main { grid-template-columns: 1fr; padding: 1rem; gap: 1rem; }
  }

  /* ============ SIDEBAR ============ */
  .sidebar {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    overflow: hidden;
    position: sticky;
    top: 120px;
    max-height: calc(100vh - 140px);
    display: flex;
    flex-direction: column;
    box-shadow: var(--shadow-sm);
  }
  @media (max-width: 860px) {
    .sidebar { position: static; max-height: 400px; }
  }
  .sidebar-head {
    padding: 0.8125rem 1rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
  }
  .sidebar-head h2 {
    font-size: 0.6875rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-muted);
  }
  .sidebar-head .count {
    font-size: 0.6875rem;
    font-weight: 600;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
  }
  .search-wrap {
    padding: 0.625rem;
    border-bottom: 1px solid var(--border);
    position: relative;
  }
  .search-icon {
    position: absolute;
    left: 1.375rem;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    pointer-events: none;
    width: 14px;
    height: 14px;
  }
  .search-input {
    width: 100%;
    padding: 0.5rem 0.75rem 0.5rem 2rem;
    border: 1px solid var(--border);
    background: var(--bg);
    border-radius: 7px;
    font: inherit;
    font-size: 0.8125rem;
    color: var(--text);
    transition: all 0.15s;
  }
  .search-input::placeholder { color: var(--text-muted); }
  .search-input:focus {
    outline: none;
    border-color: var(--text-secondary);
    background: var(--surface);
    box-shadow: 0 0 0 3px rgba(28, 25, 23, 0.06);
  }

  .file-list {
    list-style: none;
    overflow-y: auto;
    padding: 0.375rem;
    flex: 1;
    min-height: 0;
  }
  .file-list::-webkit-scrollbar { width: 6px; }
  .file-list::-webkit-scrollbar-thumb {
    background: var(--border-strong);
    border-radius: 3px;
  }
  .file-item {
    display: flex;
    align-items: center;
    gap: 0.625rem;
    padding: 0.5rem 0.625rem;
    border-radius: 7px;
    cursor: pointer;
    transition: all 0.1s;
    border: 1px solid transparent;
    user-select: none;
  }
  .file-item:hover { background: var(--bg); }
  .file-item.active {
    background: var(--bg);
    border-color: var(--border);
  }
  .file-item.active .file-label {
    color: var(--text);
    font-weight: 500;
  }
  .file-icon {
    width: 14px;
    height: 14px;
    color: var(--text-muted);
    flex-shrink: 0;
  }
  .file-item.active .file-icon { color: var(--text); }
  .file-label {
    font-size: 0.8125rem;
    color: var(--text-secondary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ============ CONTENT ============ */
  .content-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-sm);
    overflow: hidden;
    min-height: 400px;
  }
  .content-head {
    padding: 1.25rem 1.75rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    flex-wrap: wrap;
  }
  .content-meta {
    display: flex;
    align-items: center;
    gap: 0.625rem;
    flex-wrap: wrap;
  }
  .content-meta h2 {
    font-size: 1.0625rem;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--text);
  }
  .badge {
    display: inline-flex;
    align-items: center;
    padding: 0.1875rem 0.5rem;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 0.6875rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-secondary);
  }
  .copy-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.375rem;
    padding: 0.375rem 0.75rem;
    border: 1px solid var(--border);
    background: var(--surface);
    border-radius: 7px;
    font: inherit;
    font-size: 0.75rem;
    font-weight: 500;
    color: var(--text-secondary);
    cursor: pointer;
    transition: all 0.15s;
  }
  .copy-btn:hover {
    background: var(--bg);
    color: var(--text);
    border-color: var(--border-strong);
  }
  .copy-btn svg { width: 13px; height: 13px; }
  .copy-btn.copied {
    color: var(--success);
    border-color: var(--success-border);
    background: var(--success-bg);
  }

  .content-body {
    padding: 2.25rem 1.75rem 2.5rem;
    font-family: 'Lora', Georgia, serif;
    font-size: 1.0625rem;
    line-height: 1.85;
    color: var(--text);
    white-space: pre-wrap;
    word-break: break-word;
    max-width: 68ch;
    margin: 0 auto;
  }

  /* ============ EMPTY STATES ============ */
  .empty-state {
    padding: 4rem 2rem;
    text-align: center;
    color: var(--text-muted);
  }
  .empty-icon {
    width: 44px;
    height: 44px;
    margin: 0 auto 1rem;
    color: var(--border-strong);
  }
  .empty-state h3 {
    font-size: 0.9375rem;
    font-weight: 600;
    color: var(--text-secondary);
    margin-bottom: 0.25rem;
  }
  .empty-state p {
    font-size: 0.8125rem;
  }

  /* ============ SKELETON ============ */
  @keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }
  .skeleton {
    background: linear-gradient(90deg, #f5f4f0 0%, #ececea 50%, #f5f4f0 100%);
    background-size: 200% 100%;
    animation: shimmer 1.4s infinite;
    border-radius: 4px;
  }
  .sk-item {
    padding: 0.5rem 0.625rem;
    display: flex;
    align-items: center;
    gap: 0.625rem;
  }
  .sk-icon {
    width: 14px;
    height: 14px;
    border-radius: 3px;
    flex-shrink: 0;
  }
  .sk-line {
    height: 11px;
    flex: 1;
    border-radius: 3px;
  }
  .sk-content {
    padding: 2.25rem 1.75rem 2.5rem;
    max-width: 68ch;
    margin: 0 auto;
  }
  .sk-content .sk-block {
    height: 14px;
    margin-bottom: 0.75rem;
    border-radius: 4px;
  }
  .sk-content .sk-block:nth-child(1) { width: 90%; }
  .sk-content .sk-block:nth-child(2) { width: 100%; }
  .sk-content .sk-block:nth-child(3) { width: 75%; }
  .sk-content .sk-block:nth-child(4) { width: 85%; }
  .sk-content .sk-block:nth-child(5) { width: 60%; }

  /* ============ ERROR ============ */
  .error-msg {
    padding: 1rem;
    color: var(--danger);
    font-size: 0.8125rem;
    text-align: center;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>

<!-- ============ HEADER ============ -->
<header class="header">
  <div class="header-inner">
    <div class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
        </svg>
      </div>
      <div class="brand-text">
        <h1>Jokes</h1>
        <p>Multi-language collection</p>
      </div>
    </div>
    <span class="header-stat" id="langStat">0 languages</span>
  </div>
</header>

<!-- ============ LANGUAGE BAR ============ -->
<div class="lang-bar">
  <div class="lang-bar-inner" id="langTabs">
    <span style="color: var(--text-muted); font-size: 0.8125rem; padding: 0.375rem 0.25rem;">Loading…</span>
  </div>
</div>

<!-- ============ MAIN ============ -->
<div class="main">
  <aside class="sidebar">
    <div class="sidebar-head">
      <h2>Files</h2>
      <span class="count" id="fileCount">0</span>
    </div>
    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/>
        <path d="m21 21-4.35-4.35"/>
      </svg>
      <input type="text" class="search-input" id="searchBox" placeholder="Search files…" />
    </div>
    <ul class="file-list" id="fileList">
      <li class="sk-item"><div class="sk-icon skeleton"></div><div class="sk-line skeleton"></div></li>
      <li class="sk-item"><div class="sk-icon skeleton"></div><div class="sk-line skeleton" style="width:70%"></div></li>
      <li class="sk-item"><div class="sk-icon skeleton"></div><div class="sk-line skeleton" style="width:85%"></div></li>
      <li class="sk-item"><div class="sk-icon skeleton"></div><div class="sk-line skeleton" style="width:60%"></div></li>
      <li class="sk-item"><div class="sk-icon skeleton"></div><div class="sk-line skeleton" style="width:75%"></div></li>
    </ul>
  </aside>

  <main>
    <div class="content-card" id="contentContainer">
      <div class="empty-state">
        <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
          <path d="M8 7h8M8 11h6"/>
        </svg>
        <h3>No file selected</h3>
        <p>Choose a file from the list to read it</p>
      </div>
    </div>
  </main>
</div>

<script>
  // ============================================================
  // CONFIG
  // ============================================================
  const GITHUB_REPO = ""; // e.g. "your-username/your-repo"
  const BRANCH = "main";
  const DATA_ROOT = "data";

  const FLAGS = {
    english:"🇬🇧", bengali:"🇧🇩", hindi:"🇮🇳", arabic:"🇸🇦", spanish:"🇪🇸",
    french:"🇫🇷", german:"🇩🇪", japanese:"🇯🇵", chinese:"🇨🇳", korean:"🇰🇷",
    russian:"🇷🇺", italian:"🇮🇹", portuguese:"🇵🇹", dutch:"🇳🇱", turkish:"🇹🇷",
    urdu:"🇵🇰", tamil:"🇮🇳", telugu:"🇮🇳", punjabi:"🇮🇳", malay:"🇲🇾",
    indonesian:"🇮🇩", thai:"🇹🇭", vietnamese:"🇻🇳", persian:"🇮🇷"
  };

  // ============================================================
  // STATE
  // ============================================================
  let currentLang = null;
  let allFiles = [];
  let cache = {};
  let activeFile = null;
  let rawContentMap = {}; // name → raw text (for copy)

  // ============================================================
  // DOM
  // ============================================================
  const langTabsEl = document.getElementById("langTabs");
  const fileListEl = document.getElementById("fileList");
  const contentContainer = document.getElementById("contentContainer");
  const searchBox = document.getElementById("searchBox");
  const fileCountEl = document.getElementById("fileCount");
  const langStatEl = document.getElementById("langStat");

  // ============================================================
  // HELPERS
  // ============================================================
  const flagFor = c => FLAGS[c.toLowerCase()] || "🌐";
  const labelFor = c => c.charAt(0).toUpperCase() + c.slice(1);

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    })[c]);
  }

  function prettyName(raw) {
    if (/^\d+$/.test(raw)) return "Joke #" + raw;
    const parts = raw.split("-");
    if (parts.length === 3) {
      const [y, m, d] = parts;
      if (!isNaN(y) && !isNaN(m) && !isNaN(d) && +m >= 1 && +m <= 12) {
        const M = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
        return `${M[+m - 1]} ${+d}, ${y}`;
      }
    }
    return raw;
  }

  // Strip meta header lines from a .txt file so only the joke shows
  function stripMeta(text) {
    const lines = text.split("\n");
    let start = 0;
    for (let i = 0; i < Math.min(lines.length, 12); i++) {
      const l = lines[i].trim();
      const isMeta = /^(language|date|category|title|author|source)\s*:/i.test(l)
                  || /^-{3,}$/.test(l)
                  || l === "";
      if (isMeta) start = i + 1;
      else break;
    }
    const body = lines.slice(start).join("\n").trim();
    return body || text.trim(); // fallback if file was ALL meta
  }

  // ============================================================
  // LOAD LANGUAGES
  // ============================================================
  async function loadLanguages() {
    try {
      let langs = [];

      if (GITHUB_REPO) {
        const url = `https://api.github.com/repos/${GITHUB_REPO}/contents/${DATA_ROOT}?ref=${BRANCH}`;
        const res = await fetch(url);
        if (!res.ok) throw new Error(`GitHub API ${res.status}`);
        const json = await res.json();
        langs = json.filter(i => i.type === "dir").map(i => ({ code: i.name, count: null }));
      } else {
        const res = await fetch(`${DATA_ROOT}/languages.json`, { cache: "no-store" });
        if (!res.ok) throw new Error("data/languages.json not found");
        const json = await res.json();
        langs = json.languages || [];
      }

      if (!langs.length) {
        langTabsEl.innerHTML = `<span style="color:var(--text-muted);font-size:.8125rem;padding:.375rem .25rem;">No language folders in <code>data/</code> yet</span>`;
        langStatEl.textContent = "0 languages";
        return;
      }

      langs.sort((a, b) => a.code.localeCompare(b.code));
      langStatEl.textContent = `${langs.length} ${langs.length === 1 ? "language" : "languages"}`;
      renderLangTabs(langs);
      switchLanguage(langs[0].code);
    } catch (err) {
      langTabsEl.innerHTML = `<span style="color:var(--danger);font-size:.8125rem;padding:.375rem .25rem;">⚠️ ${escapeHtml(err.message)}</span>`;
    }
  }

  function renderLangTabs(langs) {
    langTabsEl.innerHTML = langs.map(l => `
      <button class="lang-pill" data-lang="${l.code}">
        <span class="flag">${flagFor(l.code)}</span>
        <span>${labelFor(l.code)}</span>
        ${l.count != null ? `<span class="num">${l.count}</span>` : ""}
      </button>
    `).join("");

    langTabsEl.querySelectorAll(".lang-pill").forEach(btn => {
      btn.addEventListener("click", () => switchLanguage(btn.dataset.lang));
    });
  }

  // ============================================================
  // SWITCH LANGUAGE
  // ============================================================
  async function switchLanguage(lang) {
    currentLang = lang;
    activeFile = null;
    searchBox.value = "";
    fileCountEl.textContent = "0";

    langTabsEl.querySelectorAll(".lang-pill").forEach(b =>
      b.classList.toggle("active", b.dataset.lang === lang)
    );

    showEmptyContent("📚", "No file selected", "Choose a file from the list to read it");

    if (cache[lang]) {
      allFiles = cache[lang];
      renderFileList(allFiles);
      return;
    }

    showFileListSkeleton();
    await loadFilesFor(lang);
  }

  // ============================================================
  // LOAD FILES
  // ============================================================
  async function loadFilesFor(lang) {
    try {
      let files = [];

      if (GITHUB_REPO) {
        const url = `https://api.github.com/repos/${GITHUB_REPO}/contents/${DATA_ROOT}/${lang}?ref=${BRANCH}`;
        const res = await fetch(url);
        if (res.ok) {
          const json = await res.json();
          files = json
            .filter(i => i.type === "file" && i.name.toLowerCase().endsWith(".txt"))
            .map(i => ({ name: i.name, url: i.download_url }));
        }
      } else {
        const res = await fetch(`${DATA_ROOT}/${lang}/manifest.json`, { cache: "no-store" });
        if (res.ok) {
          const m = await res.json();
          files = (m.files || []).map(f => ({
            name: f,
            url: `${DATA_ROOT}/${lang}/${f}`
          }));
        }
      }

      files.sort((a, b) => b.name.localeCompare(a.name));
      cache[lang] = files;

      if (lang === currentLang) {
        allFiles = files;
        renderFileList(allFiles);
      }
    } catch (err) {
      if (lang === currentLang) {
        fileListEl.innerHTML = `<li class="error-msg">⚠️ ${escapeHtml(err.message)}</li>`;
      }
    }
  }

  // ============================================================
  // RENDER FILE LIST
  // ============================================================
  function showFileListSkeleton() {
    fileListEl.innerHTML = Array.from({ length: 5 }).map((_, i) => `
      <li class="sk-item">
        <div class="sk-icon skeleton"></div>
        <div class="sk-line skeleton" style="width:${[70,85,60,75,90][i]}%"></div>
      </li>
    `).join("");
  }

  function renderFileList(files) {
    fileCountEl.textContent = files.length;

    if (!files.length) {
      fileListEl.innerHTML = `
        <div class="empty-state" style="padding:2.5rem 1rem;">
          <h3 style="font-size:.8125rem;">No files yet</h3>
          <p style="font-size:.75rem;">Upload a .txt file to this folder</p>
        </div>`;
      return;
    }

    fileListEl.innerHTML = files.map(f => {
      const raw = f.name.replace(/\.txt$/i, "");
      return `
        <li class="file-item ${activeFile === f.name ? "active" : ""}" data-name="${f.name}" data-url="${f.url}">
          <svg class="file-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/>
            <polyline points="14 2 14 8 20 8"/>
          </svg>
          <span class="file-label">${escapeHtml(prettyName(raw))}</span>
        </li>`;
    }).join("");

    fileListEl.querySelectorAll(".file-item").forEach(li => {
      li.addEventListener("click", () => openFile(li.dataset.name, li.dataset.url, li));
    });
  }

  // ============================================================
  // OPEN FILE
  // ============================================================
  async function openFile(name, url, liEl) {
    fileListEl.querySelectorAll(".file-item").forEach(l => l.classList.remove("active"));
    if (liEl) liEl.classList.add("active");
    activeFile = name;

    // Skeleton
    contentContainer.innerHTML = `
      <div class="sk-content">
        <div class="sk-block skeleton"></div>
        <div class="sk-block skeleton"></div>
        <div class="sk-block skeleton"></div>
        <div class="sk-block skeleton"></div>
        <div class="sk-block skeleton"></div>
      </div>`;

    try {
      const res = await fetch(url, { cache: "no-store" });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const raw = await res.text();
      rawContentMap[name] = raw;

      const body = stripMeta(raw) || "(empty file)";
      const dateLabel = prettyName(name.replace(/\.txt$/i, ""));

      contentContainer.innerHTML = `
        <div class="content-head">
          <div class="content-meta">
            <h2>${escapeHtml(dateLabel)}</h2>
            <span class="badge">${escapeHtml(currentLang)}</span>
          </div>
          <button class="copy-btn" id="copyBtn" title="Copy to clipboard">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
            </svg>
            <span>Copy</span>
          </button>
        </div>
        <div class="content-body">${escapeHtml(body)}</div>`;

      // wire copy
      document.getElementById("copyBtn").addEventListener("click", e => {
        const btn = e.currentTarget;
        navigator.clipboard.writeText(rawContentMap[name] || body).then(() => {
          btn.classList.add("copied");
          btn.querySelector("span").textContent = "Copied";
          setTimeout(() => {
            btn.classList.remove("copied");
            btn.querySelector("span").textContent = "Copy";
          }, 1400);
        });
      });
    } catch (err) {
      contentContainer.innerHTML = `
        <div class="empty-state">
          <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="#b91c1c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="8" x2="12" y2="12"/>
            <line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
          <h3>Could not load file</h3>
          <p>${escapeHtml(err.message)}</p>
        </div>`;
    }
  }

  // ============================================================
  // EMPTY CONTENT HELPER
  // ============================================================
  function showEmptyContent(iconText, title, subtitle) {
    contentContainer.innerHTML = `
      <div class="empty-state">
        <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
        </svg>
        <h3>${escapeHtml(title)}</h3>
        <p>${escapeHtml(subtitle)}</p>
      </div>`;
  }

  // ============================================================
  // SEARCH
  // ============================================================
  searchBox.addEventListener("input", e => {
    const q = e.target.value.trim().toLowerCase();
    renderFileList(allFiles.filter(f => f.name.toLowerCase().includes(q)));
  });

  // ============================================================
  // GO
  // ============================================================
  loadLanguages();
</script>

</body>
</html>
