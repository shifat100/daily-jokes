<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Jokes — Multi-Language Collection</title>
<meta name="description" content="Read jokes in English, Bengali, Hindi, Arabic, Spanish, French and more — updated daily." />
<link rel="canonical" href="https://YOUR-USERNAME.github.io/YOUR-REPO/" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf9f6; --surface: #fff; --surface-hover: #f5f4f0;
    --border: #e7e5e4; --border-strong: #d6d3d1;
    --text: #1c1917; --text-secondary: #57534e; --text-muted: #a8a29e;
    --success: #059669; --success-bg: #ecfdf5; --success-border: #a7f3d0;
    --danger: #b91c1c; --radius-lg: 12px;
    --shadow-sm: 0 1px 2px rgba(28,25,23,.04);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-font-smoothing: antialiased; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.6;
    min-height: 100vh;
  }

  /* HEADER */
  .header { background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
  .header-inner { max-width: 1200px; margin: 0 auto; padding: .75rem 1.5rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
  .brand { display: flex; align-items: center; gap: .75rem; }
  .brand-icon { width: 32px; height: 32px; border-radius: 8px; background: var(--text); color: var(--surface); display: flex; align-items: center; justify-content: center; }
  .brand-text h1 { font-size: .9375rem; font-weight: 600; letter-spacing: -.01em; line-height: 1.2; }
  .brand-text p { font-size: .75rem; color: var(--text-muted); margin-top: 1px; }
  .header-stat { padding: .3125rem .6875rem; background: var(--bg); border: 1px solid var(--border); border-radius: 999px; font-size: .75rem; font-weight: 500; color: var(--text-secondary); }
  .settings-btn { width: 32px; height: 32px; border: 1px solid var(--border); background: var(--surface); border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--text-secondary); }
  .settings-btn:hover { background: var(--bg); color: var(--text); }

  /* LANG BAR */
  .lang-bar { background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 56px; z-index: 99; overflow-x: auto; scrollbar-width: none; }
  .lang-bar::-webkit-scrollbar { display: none; }
  .lang-bar-inner { max-width: 1200px; margin: 0 auto; padding: .625rem 1.5rem; display: flex; gap: .25rem; min-width: max-content; }
  .lang-pill { display: inline-flex; align-items: center; gap: .4375rem; padding: .375rem .75rem; border: 1px solid transparent; background: transparent; border-radius: 7px; font: inherit; font-size: .8125rem; font-weight: 500; color: var(--text-secondary); cursor: pointer; transition: all .12s; white-space: nowrap; }
  .lang-pill:hover { background: var(--bg); color: var(--text); }
  .lang-pill.active { background: var(--text); color: var(--surface); }
  .lang-pill .flag { font-size: .9375rem; line-height: 1; }
  .lang-pill .num { font-size: .6875rem; padding: 0 .375rem; background: rgba(0,0,0,.06); border-radius: 4px; margin-left: .125rem; }
  .lang-pill.active .num { background: rgba(255,255,255,.18); }

  /* LAYOUT */
  .main { max-width: 1200px; margin: 0 auto; padding: 1.5rem; display: grid; grid-template-columns: 280px 1fr; gap: 1.5rem; align-items: start; }
  @media (max-width: 860px) { .main { grid-template-columns: 1fr; padding: 1rem; gap: 1rem; } }

  /* SIDEBAR */
  .sidebar { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; position: sticky; top: 120px; max-height: calc(100vh - 140px); display: flex; flex-direction: column; box-shadow: var(--shadow-sm); }
  @media (max-width: 860px) { .sidebar { position: static; max-height: 400px; } }
  .sidebar-head { padding: .8125rem 1rem; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); }
  .sidebar-head h2 { font-size: .6875rem; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--text-muted); }
  .sidebar-head .count { font-size: .6875rem; font-weight: 600; color: var(--text-muted); }
  .search-wrap { padding: .625rem; border-bottom: 1px solid var(--border); position: relative; }
  .search-icon { position: absolute; left: 1.375rem; top: 50%; transform: translateY(-50%); color: var(--text-muted); pointer-events: none; }
  .search-input { width: 100%; padding: .5rem .75rem .5rem 2rem; border: 1px solid var(--border); background: var(--bg); border-radius: 7px; font: inherit; font-size: .8125rem; color: var(--text); }
  .search-input:focus { outline: none; border-color: var(--text-secondary); background: var(--surface); box-shadow: 0 0 0 3px rgba(28,25,23,.06); }

  .file-list { list-style: none; overflow-y: auto; padding: .375rem; flex: 1; min-height: 0; }
  .file-item { display: flex; align-items: center; gap: .625rem; padding: .5rem .625rem; border-radius: 7px; cursor: pointer; border: 1px solid transparent; user-select: none; }
  .file-item:hover { background: var(--bg); }
  .file-item.active { background: var(--bg); border-color: var(--border); }
  .file-item.active .file-label { color: var(--text); font-weight: 500; }
  .file-icon { width: 14px; height: 14px; color: var(--text-muted); flex-shrink: 0; }
  .file-item.active .file-icon { color: var(--text); }
  .file-label { font-size: .8125rem; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* CONTENT */
  .content-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); overflow: hidden; min-height: 400px; }
  .content-head { padding: 1.25rem 1.75rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
  .content-meta { display: flex; align-items: center; gap: .625rem; flex-wrap: wrap; }
  .content-meta h2 { font-size: 1.0625rem; font-weight: 600; letter-spacing: -.01em; }
  .badge { display: inline-flex; align-items: center; padding: .1875rem .5rem; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; font-size: .6875rem; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--text-secondary); }
  .copy-btn { display: inline-flex; align-items: center; gap: .375rem; padding: .375rem .75rem; border: 1px solid var(--border); background: var(--surface); border-radius: 7px; font: inherit; font-size: .75rem; font-weight: 500; color: var(--text-secondary); cursor: pointer; }
  .copy-btn:hover { background: var(--bg); color: var(--text); border-color: var(--border-strong); }
  .copy-btn.copied { color: var(--success); border-color: var(--success-border); background: var(--success-bg); }

  .content-body { padding: 2.25rem 1.75rem 2.5rem; font-family: 'Lora', Georgia, serif; font-size: 1.0625rem; line-height: 1.85; color: var(--text); white-space: pre-wrap; word-break: break-word; max-width: 68ch; margin: 0 auto; }

  .next-btn { display: block; width: calc(100% - 3.5rem); max-width: 68ch; margin: 0 auto 2rem; padding: .75rem; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; font: inherit; font-size: .875rem; font-weight: 500; cursor: pointer; color: var(--text-secondary); }
  .next-btn:hover { background: var(--surface-hover); }

  .empty-state { padding: 4rem 2rem; text-align: center; color: var(--text-muted); }
  .empty-icon { width: 44px; height: 44px; margin: 0 auto 1rem; color: var(--border-strong); }
  .empty-state h3 { font-size: .9375rem; font-weight: 600; color: var(--text-secondary); margin-bottom: .25rem; }
  .empty-state p { font-size: .8125rem; }

  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  .skeleton { background: linear-gradient(90deg, #f5f4f0 0%, #ececea 50%, #f5f4f0 100%); background-size: 200% 100%; animation: shimmer 1.4s infinite; border-radius: 4px; }
  .sk-block { height: 14px; margin-bottom: .75rem; border-radius: 4px; }
  .sk-content { padding: 2.25rem 1.75rem; max-width: 68ch; margin: 0 auto; }
  .sk-content .sk-block:nth-child(1) { width: 90%; }
  .sk-content .sk-block:nth-child(2) { width: 100%; }
  .sk-content .sk-block:nth-child(3) { width: 75%; }

  /* MODAL */
  .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: none; align-items: center; justify-content: center; z-index: 999; }
  .modal-backdrop.open { display: flex; }
  .modal { background: var(--surface); border-radius: 12px; padding: 1.5rem; width: 340px; max-width: 90vw; box-shadow: 0 20px 60px rgba(0,0,0,.2); }
  .modal h3 { font-size: 1rem; margin-bottom: 1rem; }
  .modal label { font-size: .8125rem; font-weight: 500; display: block; margin-bottom: .375rem; }
  .modal select { width: 100%; padding: .5rem .75rem; border: 1px solid var(--border); border-radius: 8px; font: inherit; font-size: .875rem; margin-bottom: 1rem; }
  .modal-actions { display: flex; gap: .5rem; justify-content: flex-end; }
  .modal-actions button { padding: .4rem .9rem; border-radius: 7px; font: inherit; font-size: .8125rem; cursor: pointer; border: 1px solid var(--border); background: var(--surface); }
  .modal-actions button.primary { background: var(--text); color: var(--surface); border-color: var(--text); }
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <div class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" width="16" height="16"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      </div>
      <div class="brand-text"><h1>Jokes</h1><p>Multi-language collection</p></div>
    </div>
    <div style="display:flex;align-items:center;gap:.5rem;">
      <span class="header-stat" id="langStat">0 languages</span>
      <button class="settings-btn" id="settingsBtn" title="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
  </div>
</header>

<div class="lang-bar"><div class="lang-bar-inner" id="langTabs"><span style="color:var(--text-muted);font-size:.8125rem;padding:.375rem .25rem;">Loading…</span></div></div>

<div class="main">
  <aside class="sidebar">
    <div class="sidebar-head"><h2>Files</h2><span class="count" id="fileCount">0</span></div>
    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" class="search-input" id="searchBox" placeholder="Search files…" />
    </div>
    <ul class="file-list" id="fileList"></ul>
  </aside>
  <main><div class="content-card" id="contentContainer"></div></main>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <h3>Settings</h3>
    <label>Language</label>
    <select id="langSelect"></select>
    <div class="modal-actions">
      <button id="cancelSettings">Cancel</button>
      <button class="primary" id="saveSettings">Save</button>
    </div>
  </div>
</div>

<script>
  // ============================================================
  // CONFIG
  // ============================================================
  const GITHUB_REPO = "";              // e.g. "user/repo"
  const BRANCH = "main";
  const DATA_ROOT = "data";
  const STORAGE_KEY = "preferredLang";

  // ============================================================
  // BCP-47 metadata (display names)
  // ============================================================
  const LANG_META = {
    "en":"English","en-US":"English (US)","en-GB":"English (UK)",
    "bn":"Bengali","bn-BD":"Bengali (Bangladesh)","bn-IN":"Bengali (India)",
    "hi":"Hindi","hi-IN":"Hindi (India)",
    "ar":"Arabic","ar-SA":"Arabic (Saudi Arabia)","ar-EG":"Arabic (Egypt)",
    "es":"Spanish","es-ES":"Spanish (Spain)","es-MX":"Spanish (Mexico)",
    "fr":"French","fr-FR":"French (France)","fr-CA":"French (Canada)",
    "de":"German","de-DE":"German (Germany)",
    "ja":"Japanese","ja-JP":"Japanese (Japan)",
    "zh":"Chinese","zh-CN":"Chinese (Simplified)","zh-TW":"Chinese (Traditional)",
    "ko":"Korean","ko-KR":"Korean (Korea)",
    "ru":"Russian","ru-RU":"Russian (Russia)",
    "pt":"Portuguese","pt-BR":"Portuguese (Brazil)","pt-PT":"Portuguese (Portugal)",
    "it":"Italian","it-IT":"Italian (Italy)",
    "nl":"Dutch","tr":"Turkish",
    "ur":"Urdu","ur-PK":"Urdu (Pakistan)",
    "id":"Indonesian","th":"Thai","vi":"Vietnamese","fa":"Persian",
    "ta":"Tamil","te":"Telugu","ml":"Malayalam","kn":"Kannada",
    "gu":"Gujarati","mr":"Marathi","pa":"Punjabi"
  };

  // Language-only → default flag
  const LANG_FLAGS = {
    en:"🇬🇧", bn:"🇧🇩", hi:"🇮🇳", ar:"🇸🇦", es:"🇪🇸", fr:"🇫🇷", de:"🇩🇪",
    ja:"🇯🇵", zh:"🇨🇳", ko:"🇰🇷", ru:"🇷🇺", pt:"🇵🇹", it:"🇮🇹", nl:"🇳🇱",
    tr:"🇹🇷", ur:"🇵🇰", id:"🇮🇩", th:"🇹🇭", vi:"🇻🇳", fa:"🇮🇷",
    ta:"🇮🇳", te:"🇮🇳", ml:"🇮🇳", kn:"🇮🇳", gu:"🇮🇳", mr:"🇮🇳", pa:"🇮🇳"
  };

  // ============================================================
  // STATE
  // ============================================================
  let currentLang = null;
  let allFiles = [];
  let cache = {};
  let activeFile = null;
  let currentFiles = [];
  let currentIndex = -1;

  const langTabsEl = document.getElementById("langTabs");
  const fileListEl = document.getElementById("fileList");
  const contentContainer = document.getElementById("contentContainer");
  const searchBox = document.getElementById("searchBox");
  const fileCountEl = document.getElementById("fileCount");
  const langStatEl = document.getElementById("langStat");
  const modal = document.getElementById("modalBackdrop");
  const langSelect = document.getElementById("langSelect");

  // ============================================================
  // HELPERS
  // ============================================================
  function labelFor(code) {
    return LANG_META[code] || code;
  }

  function flagFor(code) {
    const parts = code.split("-");
    if (parts.length > 1) {
      // Derive flag from region part (e.g. BD → 🇧🇩)
      const region = parts[1].toUpperCase();
      if (region.length === 2 && /^[A-Z]{2}$/.test(region)) {
        return String.fromCodePoint(...[...region].map(c => 0x1F1E6 + c.charCodeAt(0) - 65));
      }
    }
    // Fall back to language-only flag
    return LANG_FLAGS[parts[0].toLowerCase()] || "🌐";
  }

  function esc(s) {
    return s.replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" })[c]);
  }

  function prettyName(raw) {
    if (/^\d+$/.test(raw)) return "Joke #" + raw;
    const p = raw.split("-");
    if (p.length === 3 && !isNaN(p[0]) && +p[1] >= 1 && +p[1] <= 12) {
      const M = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
      return `${M[+p[1]-1]} ${+p[2]}, ${p[0]}`;
    }
    return raw;
  }

  function stripMeta(text) {
    const lines = text.split("\n");
    let start = 0;
    for (let i = 0; i < Math.min(lines.length, 12); i++) {
      const l = lines[i].trim();
      if (l === "" || l.startsWith("---") || /^(language|date|category|title|author|source)\s*:/i.test(l)) start = i + 1;
      else break;
    }
    return lines.slice(start).join("\n").trim() || text.trim();
  }

  // ============================================================
  // LANGUAGE DETECTION — BCP-47 aware
  // Priority: URL > localStorage > navigator.language > English > first
  // ============================================================
  function detectLanguage(available) {
    // 1. URL path
    const pathLang = location.pathname.split("/").filter(Boolean)[0];
    if (pathLang && available.includes(pathLang)) return pathLang;

    // 2. Saved preference
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved && available.includes(saved)) return saved;

    // 3. Browser languages (e.g. ["bn-BD", "bn", "en-US", "en"])
    const nav = navigator.languages || [navigator.language || "en"];
    for (const browserLang of nav) {
      // Exact match: "bn-BD" folder exists
      if (available.includes(browserLang)) return browserLang;

      // Language-only match: browser says "bn" → find "bn-XX" or "bn"
      const primary = browserLang.split("-")[0].toLowerCase();
      const langMatch = available.find(a => {
        const aPrim = a.split("-")[0].toLowerCase();
        return aPrim === primary;
      });
      if (langMatch) return langMatch;
    }

    // 4. Fallback: prefer English
    if (available.includes("en")) return "en";
    if (available.includes("en-US")) return "en-US";
    const enMatch = available.find(a => a.toLowerCase().startsWith("en"));
    return enMatch || available[0];
  }

  // ============================================================
  // DYNAMIC META (SPA UX — static pages do real SEO)
  // ============================================================
  function updateMeta(title, description, url) {
    document.title = title;
    let d = document.querySelector('meta[name="description"]');
    if (!d) { d = document.createElement("meta"); d.name = "description"; document.head.appendChild(d); }
    d.content = description;
    let c = document.querySelector('link[rel="canonical"]');
    if (!c) { c = document.createElement("link"); c.rel = "canonical"; document.head.appendChild(c); }
    c.href = url;
  }

  // ============================================================
  // LOAD LANGUAGES
  // ============================================================
  async function loadLanguages() {
    try {
      let langs = [];
      if (GITHUB_REPO) {
        const r = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/contents/${DATA_ROOT}?ref=${BRANCH}`);
        if (r.ok) {
          const json = await r.json();
          langs = json.filter(i => i.type === "dir" && !i.name.startsWith(".")).map(i => ({ code: i.name }));
        }
      } else {
        const r = await fetch(`${DATA_ROOT}/languages.json`, { cache: "no-store" });
        if (r.ok) langs = (await r.json()).languages || [];
      }

      if (!langs.length) {
        langTabsEl.innerHTML = `<span style="color:var(--text-muted);font-size:.8125rem;padding:.375rem .25rem;">No language folders in <code>data/</code> yet</span>`;
        langStatEl.textContent = "0 languages";
        showEmpty("📚", "No languages yet", "Create a folder like data/bn-BD/ and upload .txt files");
        return;
      }

      langs.sort((a, b) => a.code.localeCompare(b.code));
      langStatEl.textContent = `${langs.length} ${langs.length === 1 ? "language" : "languages"}`;
      renderLangTabs(langs);

      const detected = detectLanguage(langs.map(l => l.code));
      switchLanguage(detected);
    } catch (e) {
      langTabsEl.innerHTML = `<span style="color:var(--danger);font-size:.8125rem;padding:.375rem .25rem;">⚠️ ${esc(e.message)}</span>`;
    }
  }

  function renderLangTabs(langs) {
    langTabsEl.innerHTML = langs.map(l => `
      <button class="lang-pill" data-lang="${l.code}" title="${esc(labelFor(l.code))}">
        <span class="flag">${flagFor(l.code)}</span>
        <span>${esc(labelFor(l.code))}</span>
        ${l.count != null ? `<span class="num">${l.count}</span>` : ""}
      </button>`).join("");
    langTabsEl.querySelectorAll(".lang-pill").forEach(b =>
      b.addEventListener("click", () => switchLanguage(b.dataset.lang))
    );

    // Populate settings dropdown
    langSelect.innerHTML = langs.map(l =>
      `<option value="${l.code}">${flagFor(l.code)} ${esc(labelFor(l.code))}</option>`
    ).join("");
  }

  // ============================================================
  // SWITCH LANGUAGE
  // ============================================================
  async function switchLanguage(lang) {
    currentLang = lang;
    localStorage.setItem(STORAGE_KEY, lang);
    activeFile = null;
    currentIndex = -1;
    currentFiles = [];
    searchBox.value = "";
    fileCountEl.textContent = "0";

    langTabsEl.querySelectorAll(".lang-pill").forEach(b =>
      b.classList.toggle("active", b.dataset.lang === lang)
    );
    langSelect.value = lang;

    showEmpty("Loading…", "");

    if (cache[lang]) {
      allFiles = cache[lang];
      renderFileList(allFiles);
      if (allFiles.length) openFile(allFiles[0].name, allFiles[0].url, null, 0);
      return;
    }

    await loadFilesFor(lang);
  }

  async function loadFilesFor(lang) {
    let files = [];
    try {
      if (GITHUB_REPO) {
        const r = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/contents/${DATA_ROOT}/${lang}?ref=${BRANCH}`);
        if (r.ok) {
          const json = await r.json();
          files = json
            .filter(i => i.type === "file" && i.name.endsWith(".txt"))
            .map(i => ({ name: i.name, url: i.download_url }));
        }
      } else {
        const r = await fetch(`${DATA_ROOT}/${lang}/manifest.json`, { cache: "no-store" });
        if (r.ok) {
          const m = await r.json();
          files = (m.files || []).map(f => ({ name: f, url: `${DATA_ROOT}/${lang}/${f}` }));
        }
      }
    } catch (_) {}

    files.sort((a, b) => b.name.localeCompare(a.name));
    cache[lang] = files;

    if (lang !== currentLang) return;
    allFiles = files;
    renderFileList(allFiles);
    if (files.length) openFile(files[0].name, files[0].url, null, 0);
  }

  // ============================================================
  // FILE LIST
  // ============================================================
  function renderFileList(files) {
    fileCountEl.textContent = files.length;
    if (!files.length) {
      fileListEl.innerHTML = `<div style="padding:2rem 1rem;text-align:center;color:var(--text-muted);font-size:.8125rem;">No files yet</div>`;
      return;
    }
    fileListEl.innerHTML = files.map(f => `
      <li class="file-item ${activeFile === f.name ? "active" : ""}" data-name="${esc(f.name)}" data-url="${esc(f.url)}">
        <svg class="file-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg>
        <span class="file-label">${esc(prettyName(f.name.replace(/\.txt$/i, "")))}</span>
      </li>`).join("");

    fileListEl.querySelectorAll(".file-item").forEach(li => {
      li.addEventListener("click", () => {
        const idx = allFiles.findIndex(f => f.name === li.dataset.name);
        openFile(li.dataset.name, li.dataset.url, li, idx);
      });
    });
  }

  // ============================================================
  // OPEN FILE — auto-read first joke + scroll-to-next
  // ============================================================
  async function openFile(name, url, liEl, index) {
    fileListEl.querySelectorAll(".file-item").forEach(l => l.classList.remove("active"));
    if (liEl) liEl.classList.add("active");
    activeFile = name;
    currentFiles = allFiles;
    currentIndex = index != null ? index : allFiles.findIndex(f => f.name === name);

    contentContainer.innerHTML = `<div class="sk-content">
      <div class="sk-block skeleton"></div>
      <div class="sk-block skeleton"></div>
      <div class="sk-block skeleton"></div>
    </div>`;

    try {
      const res = await fetch(url, { cache: "no-store" });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const raw = await res.text();
      const body = stripMeta(raw);
      const dateLabel = prettyName(name.replace(/\.txt$/i, ""));

      // Dynamic SPA meta (static SEO pages cover real ranking)
      const snippet = body.slice(0, 70).replace(/\n/g, " ");
      updateMeta(
        `${snippet} — ${labelFor(currentLang)} Joke | Jokes`,
        body.slice(0, 155).replace(/\n/g, " "),
        `${location.origin}${location.pathname}?lang=${currentLang}&joke=${name}`
      );

      const isLast = currentIndex >= currentFiles.length - 1;
      contentContainer.innerHTML = `
        <div class="content-head">
          <div class="content-meta">
            <h2>${esc(dateLabel)}</h2>
            <span class="badge">${esc(labelFor(currentLang))}</span>
          </div>
          <button class="copy-btn" id="copyBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="13" height="13"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            <span>Copy</span>
          </button>
        </div>
        <div class="content-body">${esc(body)}</div>
        ${isLast ? "" : `<button class="next-btn" id="nextBtn">Next joke →</button>`}`;

      document.getElementById("copyBtn").addEventListener("click", e => {
        navigator.clipboard.writeText(raw).then(() => {
          const b = e.currentTarget;
          b.classList.add("copied");
          b.querySelector("span").textContent = "Copied";
          setTimeout(() => { b.classList.remove("copied"); b.querySelector("span").textContent = "Copy"; }, 1400);
        });
      });

      const nextBtn = document.getElementById("nextBtn");
      if (nextBtn) {
        nextBtn.addEventListener("click", () => {
          const n = currentFiles[currentIndex + 1];
          if (n) openFile(n.name, n.url, null, currentIndex + 1);
        });
      }

      // Auto-load next joke on scroll bottom
      window.onscroll = () => {
        if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 200 && currentIndex < currentFiles.length - 1) {
          const n = currentFiles[currentIndex + 1];
          if (n && activeFile !== n.name) {
            openFile(n.name, n.url, null, currentIndex + 1);
            window.scrollTo({ top: 0, behavior: "smooth" });
          }
        }
      };
    } catch (e) {
      contentContainer.innerHTML = `<div class="empty-state"><h3>Could not load</h3><p>${esc(e.message)}</p></div>`;
    }
  }

  function showEmpty(title, subtitle) {
    contentContainer.innerHTML = `
      <div class="empty-state">
        <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        <h3>${esc(title)}</h3>
        ${subtitle ? `<p>${esc(subtitle)}</p>` : ""}
      </div>`;
  }

  // ============================================================
  // SETTINGS
  // ============================================================
  document.getElementById("settingsBtn").addEventListener("click", () => {
    langSelect.value = currentLang;
    modal.classList.add("open");
  });
  document.getElementById("cancelSettings").addEventListener("click", () => modal.classList.remove("open"));
  document.getElementById("saveSettings").addEventListener("click", () => {
    modal.classList.remove("open");
    switchLanguage(langSelect.value);
  });
  modal.addEventListener("click", e => { if (e.target === modal) modal.classList.remove("open"); });

  // Search
  searchBox.addEventListener("input", e => {
    const q = e.target.value.trim().toLowerCase();
    renderFileList(allFiles.filter(f => f.name.toLowerCase().includes(q)));
  });

  // GO
  loadLanguages();
</script>
</body>
</html>
