<style>
  :root {
    --bg: #faf9f6; --surface: #ffffff; --surface-hover: #f5f4f0;
    --border: #e7e5e4; --border-strong: #d6d3d1;
    --text: #1c1917; --text-secondary: #57534e; --text-muted: #a8a29e;
    --success: #059669; --success-bg: #ecfdf5; --success-border: #a7f3d0;
    --accent: #2563eb; --accent-light: #eff6ff;
    --danger: #b91c1c; --radius-lg: 14px;
    --shadow-sm: 0 1px 2px rgba(28,25,23,.04);
    --shadow-float: 0 10px 30px -5px rgba(0,0,0,.1), 0 4px 10px -3px rgba(0,0,0,.05);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-font-smoothing: antialiased; scroll-behavior: smooth; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.6;
    min-height: 100vh; display: flex; flex-direction: column;
    padding-bottom: 70px; /* Space for thumb navigation bar */
  }

  /* HEADER */
  .header { background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
  .header-inner { max-width: 1200px; margin: 0 auto; padding: .75rem 1.25rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
  .brand { display: flex; align-items: center; gap: .75rem; text-decoration: none; color: inherit; }
  .brand-icon { width: 34px; height: 34px; border-radius: 9px; background: var(--text); color: var(--surface); display: flex; align-items: center; justify-content: center; }
  .brand-text h1 { font-size: .95rem; font-weight: 600; letter-spacing: -.01em; line-height: 1.2; }
  .brand-text p { font-size: .75rem; color: var(--text-muted); margin-top: 1px; }
  .header-stat { padding: .3rem .65rem; background: var(--bg); border: 1px solid var(--border); border-radius: 999px; font-size: .75rem; font-weight: 500; color: var(--text-secondary); }
  .settings-btn { width: 34px; height: 34px; border: 1px solid var(--border); background: var(--surface); border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--text-secondary); transition: all .15s; }
  .settings-btn:hover { background: var(--bg); color: var(--text); }

  /* LANG BAR */
  .lang-bar { background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 57px; z-index: 99; overflow-x: auto; scrollbar-width: none; }
  .lang-bar::-webkit-scrollbar { display: none; }
  .lang-bar-inner { max-width: 1200px; margin: 0 auto; padding: .55rem 1.25rem; display: flex; gap: .35rem; min-width: max-content; }
  .lang-pill { display: inline-flex; align-items: center; gap: .45rem; padding: .4rem .75rem; border: 1px solid transparent; background: transparent; border-radius: 8px; font: inherit; font-size: .8125rem; font-weight: 500; color: var(--text-secondary); cursor: pointer; transition: all .15s; white-space: nowrap; }
  .lang-pill:hover { background: var(--bg); color: var(--text); }
  .lang-pill.active { background: var(--text); color: var(--surface); }
  .lang-pill .flag { font-size: .95rem; line-height: 1; }
  .lang-pill .num { font-size: .6875rem; padding: 0 .375rem; background: rgba(0,0,0,.06); border-radius: 4px; margin-left: .125rem; }
  .lang-pill.active .num { background: rgba(255,255,255,.2); }

  /* MAIN LAYOUT */
  .main { max-width: 1200px; margin: 0 auto; padding: 1.25rem; display: grid; grid-template-columns: 280px 1fr; gap: 1.5rem; align-items: start; flex: 1; width: 100%; }

  /* MOBILE-FIRST "HAND-TO-MOUTH" ADJUSTMENT */
  @media (max-width: 860px) {
    .main { display: flex; flex-direction: column; padding: 1rem; gap: 1rem; }
    main { order: 1; width: 100%; }
    .sidebar { order: 2; width: 100%; margin-top: .5rem; }
  }

  /* SIDEBAR */
  .sidebar { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; position: sticky; top: 120px; max-height: calc(100vh - 140px); display: flex; flex-direction: column; box-shadow: var(--shadow-sm); }
  @media (max-width: 860px) { .sidebar { position: static; max-height: 350px; } }
  .sidebar-head { padding: .75rem 1rem; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); }
  .sidebar-head h2 { font-size: .6875rem; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--text-muted); }
  .sidebar-head .count { font-size: .6875rem; font-weight: 600; color: var(--text-muted); }
  .search-wrap { padding: .625rem; border-bottom: 1px solid var(--border); position: relative; }
  .search-icon { position: absolute; left: 1.25rem; top: 50%; transform: translateY(-50%); color: var(--text-muted); pointer-events: none; }
  .search-input { width: 100%; padding: .45rem .75rem .45rem 2rem; border: 1px solid var(--border); background: var(--bg); border-radius: 7px; font: inherit; font-size: .8125rem; color: var(--text); }
  .search-input:focus { outline: none; border-color: var(--text-secondary); background: var(--surface); box-shadow: 0 0 0 3px rgba(28,25,23,.05); }

  .file-list { list-style: none; overflow-y: auto; padding: .35rem; flex: 1; min-height: 0; }
  .file-item { display: flex; align-items: center; gap: .625rem; padding: .5rem .625rem; border-radius: 7px; cursor: pointer; border: 1px solid transparent; user-select: none; }
  .file-item:hover { background: var(--bg); }
  .file-item.active { background: var(--bg); border-color: var(--border); }
  .file-item.active .file-label { color: var(--text); font-weight: 600; }
  .file-icon { width: 14px; height: 14px; color: var(--text-muted); flex-shrink: 0; }
  .file-item.active .file-icon { color: var(--text); }
  .file-label { font-size: .8125rem; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* CONTENT CARD */
  .content-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); overflow: hidden; min-height: 380px; display: flex; flex-direction: column; }
  .content-head { padding: 1.15rem 1.5rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: .75rem; flex-wrap: wrap; background: #fff; }
  .content-meta { display: flex; align-items: center; gap: .625rem; flex-wrap: wrap; }
  .content-meta h2 { font-size: 1.05rem; font-weight: 600; letter-spacing: -.01em; }
  .badge { display: inline-flex; align-items: center; padding: .2rem .5rem; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; font-size: .6875rem; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--text-secondary); }

  .card-actions { display: flex; align-items: center; gap: .5rem; }
  .action-btn { display: inline-flex; align-items: center; gap: .375rem; padding: .4rem .75rem; border: 1px solid var(--border); background: var(--surface); border-radius: 7px; font: inherit; font-size: .75rem; font-weight: 500; color: var(--text-secondary); cursor: pointer; transition: all .15s; }
  .action-btn:hover { background: var(--bg); color: var(--text); border-color: var(--border-strong); }
  .action-btn.copied { color: var(--success); border-color: var(--success-border); background: var(--success-bg); }

  /* BITE-SIZED JOKE BODY */
  .content-body { padding: 2.25rem 1.5rem 2.5rem; font-family: 'Lora', Georgia, serif; font-size: 1.125rem; line-height: 1.85; color: var(--text); white-space: pre-wrap; word-break: break-word; max-width: 65ch; margin: 0 auto; flex: 1; }

  /* HAND-TO-MOUTH FLOATING BOTTOM THUMB-BAR (Mobile ergonomic control) */
  .thumb-bar {
    position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
    background: rgba(255, 255, 255, 0.94); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--border-strong); box-shadow: var(--shadow-float);
    border-radius: 999px; padding: .35rem .6rem; display: flex; align-items: center; gap: .4rem;
    z-index: 95; width: max-content; max-width: calc(100vw - 2rem);
  }
  .thumb-btn {
    border: none; background: transparent; padding: .5rem .85rem; border-radius: 999px;
    font: inherit; font-size: .8125rem; font-weight: 500; color: var(--text-secondary);
    display: inline-flex; align-items: center; gap: .4rem; cursor: pointer; transition: all .15s;
    user-select: none; -webkit-tap-highlight-color: transparent;
  }
  .thumb-btn:hover { background: var(--surface-hover); color: var(--text); }
  .thumb-btn:active { transform: scale(0.96); }
  .thumb-btn.primary { background: var(--text); color: var(--surface); }
  .thumb-btn.primary:hover { background: #333; }
  .thumb-divider { width: 1px; height: 18px; background: var(--border); margin: 0 2px; }

  /* EMPTY & LOADING */
  .empty-state { padding: 4rem 1.5rem; text-align: center; color: var(--text-muted); margin: auto; }
  .empty-icon { width: 44px; height: 44px; margin: 0 auto 1rem; color: var(--border-strong); }
  .empty-state h3 { font-size: .95rem; font-weight: 600; color: var(--text-secondary); margin-bottom: .25rem; }
  .empty-state p { font-size: .8125rem; }

  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  .skeleton { background: linear-gradient(90deg, #f5f4f0 0%, #ececea 50%, #f5f4f0 100%); background-size: 200% 100%; animation: shimmer 1.4s infinite; border-radius: 4px; }
  .sk-block { height: 16px; margin-bottom: .9rem; border-radius: 4px; }
  .sk-content { padding: 2.25rem 1.5rem; max-width: 65ch; margin: 0 auto; width: 100%; }
  .sk-content .sk-block:nth-child(1) { width: 92%; }
  .sk-content .sk-block:nth-child(2) { width: 100%; }
  .sk-content .sk-block:nth-child(3) { width: 70%; }

  /* FOOTER */
  .footer { margin-top: auto; border-top: 1px solid var(--border); background: var(--surface); padding: 1.5rem 1.25rem; text-align: center; font-size: .75rem; color: var(--text-muted); }
  .footer a { color: var(--text-secondary); text-decoration: none; margin: 0 .4rem; }
  .footer a:hover { text-decoration: underline; }

  /* MODAL */
  .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: none; align-items: center; justify-content: center; z-index: 999; }
  .modal-backdrop.open { display: flex; }
  .modal { background: var(--surface); border-radius: 12px; padding: 1.5rem; width: 340px; max-width: 90vw; box-shadow: 0 20px 60px rgba(0,0,0,.2); }
  .modal h3 { font-size: 1rem; margin-bottom: 1rem; }
  .modal label { font-size: .8125rem; font-weight: 500; display: block; margin-bottom: .375rem; }
  .modal select { width: 100%; padding: .5rem .75rem; border: 1px solid var(--border); border-radius: 8px; font: inherit; font-size: .875rem; margin-bottom: 1rem; }
  .modal-actions { display: flex; gap: .5rem; justify-content: flex-end; }
  .modal-actions button { padding: .4rem .9rem; border-radius: 7px; font: inherit; font-size: .8125rem; cursor: pointer; border: 1px solid var(--border); background: var(--surface); }
  .modal-actions button.primary { background: var(--text); color: var(--surface); border-color: var(--text); }
</style>
</head>

<script>
  // ============================================================
  // CONFIG
  // ============================================================
  const GITHUB_REPO = "";              // e.g. "user/repo"
  const BRANCH = "main";
  const DATA_ROOT = "data";
  const STORAGE_KEY = "preferredLang";

  // ============================================================
  // BCP-47 METADATA
  // ============================================================
  const LANG_META = {
    "en":"English","en-US":"English (US)","en-GB":"English (UK)",
    "bn":"Bengali","bn-BD":"Bengali (Bangladesh)","bn-IN":"Bengali (India)",
    "hi":"Hindi","hi-IN":"Hindi (India)",
    "ar":"Arabic","ar-SA":"Arabic (Saudi Arabia)","ar-EG":"Arabic (Egypt)",
    "es":"Spanish","es-ES":"Spanish (Spain)","es-MX":"Spanish (Mexico)",
    "fr":"French","fr-FR":"French (France)","fr-CA":"French (Canada)",
    "de":"German","de-DE":"German (Germany)",
    "ja":"Japanese","ja-JP":"Japanese (Japan)",
    "zh":"Chinese","zh-CN":"Chinese (Simplified)","zh-TW":"Chinese (Traditional)",
    "ko":"Korean","ko-KR":"Korean (Korea)",
    "ru":"Russian","ru-RU":"Russian (Russia)",
    "pt":"Portuguese","pt-BR":"Portuguese (Brazil)","pt-PT":"Portuguese (Portugal)",
    "it":"Italian","it-IT":"Italian (Italy)",
    "nl":"Dutch","tr":"Turkish","ur":"Urdu","id":"Indonesian","vi":"Vietnamese"
  };

  const LANG_FLAGS = {
    en:"🇬🇧", bn:"🇧🇩", hi:"🇮🇳", ar:"🇸🇦", es:"🇪🇸", fr:"🇫🇷", de:"🇩🇪",
    ja:"🇯🇵", zh:"🇨🇳", ko:"🇰🇷", ru:"🇷🇺", pt:"🇵🇹", it:"🇮🇹", nl:"🇳🇱",
    tr:"🇹🇷", ur:"🇵🇰", id:"🇮🇩", vi:"🇻🇳"
  };

  // ============================================================
  // STATE
  // ============================================================
  let currentLang = null;
  let allFiles = [];
  let cache = {};
  let activeFile = null;
  let currentFiles = [];
  let currentIndex = -1;
  let currentRawText = "";

  const langTabsEl = document.getElementById("langTabs");
  const fileListEl = document.getElementById("fileList");
  const contentContainer = document.getElementById("contentContainer");
  const searchBox = document.getElementById("searchBox");
  const fileCountEl = document.getElementById("fileCount");
  const langStatEl = document.getElementById("langStat");
  const modal = document.getElementById("modalBackdrop");
  const langSelect = document.getElementById("langSelect");

  document.getElementById("currentYear").textContent = new Date().getFullYear();

  function labelFor(code) { return LANG_META[code] || code; }

  function flagFor(code) {
    const parts = code.split("-");
    if (parts.length > 1) {
      const region = parts[1].toUpperCase();
      if (region.length === 2 && /^[A-Z]{2}$/.test(region)) {
        return String.fromCodePoint(...[...region].map(c => 0x1F1E6 + c.charCodeAt(0) - 65));
      }
    }
    return LANG_FLAGS[parts[0].toLowerCase()] || "🌐";
  }

  function esc(s) {
    return (s || "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" })[c]);
  }

  function prettyName(raw) {
    if (/^\d+$/.test(raw)) return "Joke #" + raw;
    const p = raw.split("-");
    if (p.length === 3 && !isNaN(p[0]) && +p[1] >= 1 && +p[1] <= 12) {
      const M = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
      return `${M[+p[1]-1]} ${+p[2]}, ${p[0]}`;
    }
    return raw.replace(/[-_]/g, " ");
  }

  function stripMeta(text) {
    const lines = text.split("\n");
    let start = 0;
    for (let i = 0; i < Math.min(lines.length, 12); i++) {
      const l = lines[i].trim();
      if (l === "" || l.startsWith("---") || /^(language|date|category|title|author|source)\s*:/i.test(l)) start = i + 1;
      else break;
    }
    return lines.slice(start).join("\n").trim() || text.trim();
  }

  // ============================================================
  // SEO & SOCIAL GRAPH UPDATER
  // ============================================================
  function updateSEO(title, description, url, jokeBody) {
    document.title = title;

    const setMeta = (name, val, isProp = false) => {
      let el = document.querySelector(isProp ? `meta[property="${name}"]` : `meta[name="${name}"]`);
      if (!el) {
        el = document.createElement("meta");
        if (isProp) el.setAttribute("property", name); else el.name = name;
        document.head.appendChild(el);
      }
      el.content = val;
    };

    setMeta("description", description);
    setMeta("og:title", title, true);
    setMeta("og:description", description, true);
    setMeta("og:url", url, true);
    setMeta("twitter:title", title);
    setMeta("twitter:description", description);

    let can = document.getElementById("canonicalUrl");
    if (can) can.href = url;

    // Update JSON-LD for Search Engines
    const schemaScript = document.getElementById("schemaOrg");
    if (schemaScript) {
      const schemaData = {
        "@context": "https://schema.org",
        "@type": "CreativeWork",
        "headline": title,
        "text": jokeBody ? jokeBody.slice(0, 300) : description,
        "inLanguage": currentLang,
        "genre": "Humor",
        "url": url
      };
      schemaScript.textContent = JSON.stringify(schemaData);
    }

    // Keep URL in address bar shareable and indexable
    if (window.history && window.history.replaceState) {
      window.history.replaceState(null, title, url);
    }
  }

  // ============================================================
  // LANGUAGE DETECTION
  // ============================================================
  function detectLanguage(available) {
    const params = new URLSearchParams(location.search);
    const qLang = params.get("lang");
    if (qLang && available.includes(qLang)) return qLang;

    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved && available.includes(saved)) return saved;

    const nav = navigator.languages || [navigator.language || "en"];
    for (const browserLang of nav) {
      if (available.includes(browserLang)) return browserLang;
      const primary = browserLang.split("-")[0].toLowerCase();
      const match = available.find(a => a.split("-")[0].toLowerCase() === primary);
      if (match) return match;
    }

    if (available.includes("en")) return "en";
    return available[0];
  }

  // ============================================================
  // LOAD LANGUAGES
  // ============================================================
  async function loadLanguages() {
    try {
      let langs = [];
      if (GITHUB_REPO) {
        const r = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/contents/${DATA_ROOT}?ref=${BRANCH}`);
        if (r.ok) {
          const json = await r.json();
          langs = json.filter(i => i.type === "dir" && !i.name.startsWith(".")).map(i => ({ code: i.name }));
        }
      } else {
        const r = await fetch(`${DATA_ROOT}/languages.json`, { cache: "no-store" });
        if (r.ok) langs = (await r.json()).languages || [];
      }

      if (!langs.length) {
        langTabsEl.innerHTML = `<span style="color:var(--text-muted);font-size:.8125rem;padding:.375rem .25rem;">No languages found in <code>data/</code></span>`;
        langStatEl.textContent = "0 languages";
        return;
      }

      langs.sort((a, b) => a.code.localeCompare(b.code));
      langStatEl.textContent = `${langs.length} ${langs.length === 1 ? "language" : "languages"}`;
      renderLangTabs(langs);

      const detected = detectLanguage(langs.map(l => l.code));
      switchLanguage(detected);
    } catch (e) {
      langTabsEl.innerHTML = `<span style="color:var(--danger);font-size:.8125rem;">⚠️ ${esc(e.message)}</span>`;
    }
  }

  function renderLangTabs(langs) {
    langTabsEl.innerHTML = langs.map(l => `
      <button class="lang-pill" data-lang="${l.code}">
        <span class="flag">${flagFor(l.code)}</span>
        <span>${esc(labelFor(l.code))}</span>
        ${l.count != null ? `<span class="num">${l.count}</span>` : ""}
      </button>`).join("");

    langTabsEl.querySelectorAll(".lang-pill").forEach(b =>
      b.addEventListener("click", () => switchLanguage(b.dataset.lang))
    );

    langSelect.innerHTML = langs.map(l =>
      `<option value="${l.code}">${flagFor(l.code)} ${esc(labelFor(l.code))}</option>`
    ).join("");
  }

  // ============================================================
  // SWITCH LANGUAGE
  // ============================================================
  async function switchLanguage(lang) {
    currentLang = lang;
    localStorage.setItem(STORAGE_KEY, lang);
    activeFile = null;
    currentIndex = -1;
    currentFiles = [];
    searchBox.value = "";
    fileCountEl.textContent = "0";

    langTabsEl.querySelectorAll(".lang-pill").forEach(b =>
      b.classList.toggle("active", b.dataset.lang === lang)
    );
    langSelect.value = lang;

    if (cache[lang]) {
      allFiles = cache[lang];
      renderFileList(allFiles);
      if (allFiles.length) openFile(allFiles[0].name, allFiles[0].url, null, 0);
      return;
    }

    await loadFilesFor(lang);
  }

  async function loadFilesFor(lang) {
    let files = [];
    try {
      if (GITHUB_REPO) {
        const r = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/contents/${DATA_ROOT}/${lang}?ref=${BRANCH}`);
        if (r.ok) {
          const json = await r.json();
          files = json
            .filter(i => i.type === "file" && i.name.endsWith(".txt"))
            .map(i => ({ name: i.name, url: i.download_url }));
        }
      } else {
        const r = await fetch(`${DATA_ROOT}/${lang}/manifest.json`, { cache: "no-store" });
        if (r.ok) {
          const m = await r.json();
          files = (m.files || []).map(f => ({ name: f, url: `${DATA_ROOT}/${lang}/${f}` }));
        }
      }
    } catch (_) {}

    files.sort((a, b) => b.name.localeCompare(a.name));
    cache[lang] = files;

    if (lang !== currentLang) return;
    allFiles = files;
    renderFileList(allFiles);

    // Check if URL specifies a particular joke
    const params = new URLSearchParams(location.search);
    const targetJoke = params.get("joke");
    const foundIdx = targetJoke ? files.findIndex(f => f.name === targetJoke) : -1;

    if (foundIdx !== -1) {
      openFile(files[foundIdx].name, files[foundIdx].url, null, foundIdx);
    } else if (files.length) {
      openFile(files[0].name, files[0].url, null, 0);
    }
  }

  function renderFileList(files) {
    fileCountEl.textContent = files.length;
    if (!files.length) {
      fileListEl.innerHTML = `<div style="padding:1.5rem 1rem;text-align:center;color:var(--text-muted);font-size:.8125rem;">No jokes yet</div>`;
      return;
    }
    fileListEl.innerHTML = files.map(f => `
      <li class="file-item ${activeFile === f.name ? "active" : ""}" data-name="${esc(f.name)}" data-url="${esc(f.url)}">
        <svg class="file-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg>
        <span class="file-label">${esc(prettyName(f.name.replace(/\.txt$/i, "")))}</span>
      </li>`).join("");

    fileListEl.querySelectorAll(".file-item").forEach(li => {
      li.addEventListener("click", () => {
        const idx = allFiles.findIndex(f => f.name === li.dataset.name);
        openFile(li.dataset.name, li.dataset.url, li, idx);
      });
    });
  }

  // ============================================================
  // OPEN & CONSUME JOKE
  // ============================================================
  async function openFile(name, url, liEl, index) {
    fileListEl.querySelectorAll(".file-item").forEach(l => l.classList.remove("active"));
    if (liEl) liEl.classList.add("active");
    else {
      const match = fileListEl.querySelector(`[data-name="${CSS.escape(name)}"]`);
      if (match) match.classList.add("active");
    }

    activeFile = name;
    currentFiles = allFiles;
    currentIndex = index != null ? index : allFiles.findIndex(f => f.name === name);

    contentContainer.innerHTML = `<div class="sk-content">
      <div class="sk-block skeleton"></div>
      <div class="sk-block skeleton"></div>
      <div class="sk-block skeleton"></div>
    </div>`;

    try {
      const res = await fetch(url, { cache: "no-store" });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const raw = await res.text();
      currentRawText = raw;
      const body = stripMeta(raw);
      const titleLabel = prettyName(name.replace(/\.txt$/i, ""));

      // Update SEO Metas & Canonical URLs
      const cleanSnippet = body.slice(0, 80).replace(/\s+/g, " ");
      const shareUrl = `${location.origin}${location.pathname}?lang=${currentLang}&joke=${encodeURIComponent(name)}`;
      updateSEO(
        `${titleLabel} — ${cleanSnippet} | ${labelFor(currentLang)} Jokes`,
        body.slice(0, 160).replace(/\s+/g, " "),
        shareUrl,
        body
      );

      contentContainer.innerHTML = `
        <header class="content-head">
          <div class="content-meta">
            <h2>${esc(titleLabel)}</h2>
            <span class="badge">${esc(labelFor(currentLang))}</span>
          </div>
          <div class="card-actions">
            <button class="action-btn" id="copyBtnTop">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="13" height="13"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
              <span>Copy</span>
            </button>
          </div>
        </header>
        <div class="content-body">${esc(body)}</div>
      `;

      document.getElementById("copyBtnTop").addEventListener("click", copyJoke);

      // Scroll smoothly back to reading area on mobile
      if (window.innerWidth <= 860) {
        window.scrollTo({ top: contentContainer.offsetTop - 70, behavior: "smooth" });
      }

    } catch (e) {
      contentContainer.innerHTML = `<div class="empty-state"><h3>Could not load</h3><p>${esc(e.message)}</p></div>`;
    }
  }

  // ============================================================
  // QUICK ACTIONS (COPY, SHARE, RANDOM, NEXT, PREV)
  // ============================================================
  function copyJoke() {
    if (!currentRawText) return;
    navigator.clipboard.writeText(stripMeta(currentRawText)).then(() => {
      const topBtn = document.getElementById("copyBtnTop");
      if (topBtn) {
        topBtn.classList.add("copied");
        topBtn.querySelector("span").textContent = "Copied!";
        setTimeout(() => {
          topBtn.classList.remove("copied");
          topBtn.querySelector("span").textContent = "Copy";
        }, 1500);
      }
    });
  }

  function shareJoke() {
    const url = window.location.href;
    const title = document.title;
    if (navigator.share) {
      navigator.share({ title: title, text: stripMeta(currentRawText).slice(0, 100) + "...", url: url }).catch(() => {});
    } else {
      navigator.clipboard.writeText(url).then(() => alert("Link copied to clipboard!"));
    }
  }

  function nextJoke() {
    if (currentIndex < currentFiles.length - 1) {
      const n = currentFiles[currentIndex + 1];
      openFile(n.name, n.url, null, currentIndex + 1);
    }
  }

  function prevJoke() {
    if (currentIndex > 0) {
      const p = currentFiles[currentIndex - 1];
      openFile(p.name, p.url, null, currentIndex - 1);
    }
  }

  function randomJoke() {
    if (currentFiles.length <= 1) return;
    let rand = Math.floor(Math.random() * currentFiles.length);
    if (rand === currentIndex) rand = (rand + 1) % currentFiles.length;
    const r = currentFiles[rand];
    openFile(r.name, r.url, null, rand);
  }

  // Bottom Floating Thumb Bar Events
  document.getElementById("nextBtnThumb").addEventListener("click", nextJoke);
  document.getElementById("prevBtnThumb").addEventListener("click", prevJoke);
  document.getElementById("randomBtnThumb").addEventListener("click", randomJoke);
  document.getElementById("shareBtnThumb").addEventListener("click", shareJoke);

  // Settings Modal Events
  document.getElementById("settingsBtn").addEventListener("click", () => {
    langSelect.value = currentLang;
    modal.classList.add("open");
  });
  document.getElementById("cancelSettings").addEventListener("click", () => modal.classList.remove("open"));
  document.getElementById("saveSettings").addEventListener("click", () => {
    modal.classList.remove("open");
    switchLanguage(langSelect.value);
  });
  modal.addEventListener("click", e => { if (e.target === modal) modal.classList.remove("open"); });

  // Instant Search
  searchBox.addEventListener("input", e => {
    const q = e.target.value.trim().toLowerCase();
    renderFileList(allFiles.filter(f => f.name.toLowerCase().includes(q)));
  });

  // START
  loadLanguages();
</script>
</body>
</html>
