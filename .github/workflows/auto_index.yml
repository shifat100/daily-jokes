name: Auto Index + SEO Build

on:
  push:
    paths:
      - 'data/**/*.txt'
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Rebuild manifests
        run: python scripts/rebuild_manifests.py

      - name: Build SEO pages
        run: python scripts/build_seo.py

      - name: Show generated structure
        run: |
          echo "===== data/ ====="
          ls -R data/ || true
          echo "===== root ====="
          ls -la

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "indexed: $(date +'%Y-%m-%d %H:%M')" || echo "No changes to commit"
          git push
