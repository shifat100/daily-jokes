    <h1 style="font-size:1.25rem;margin-bottom:1rem;font-family:sans-serif;">English (US) Joke</h1>
    <article style="white-space:pre-wrap;word-break:break-word;">My son told me that he had something to say.
&quot;What is it, boy?&quot; I asked.

&quot;Dad...&quot; he said. &quot;Is it OK if I invite my date over for dinner?&quot;

&quot;That&#x27;s fine,&quot; I smiled. &quot;as long as she isn&#x27;t black!&quot;

He said, &quot;Don&#x27;t worry. He isn&#x27;t.&quot;</article>
