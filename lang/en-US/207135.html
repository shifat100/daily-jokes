    <article style="white-space:pre-wrap;word-break:break-word;">60 Divided By 1/3rd
What is 60 divided by 1/3rd? 



Read carefully. 



If you think it&#x27;s 180, then you&#x27;re wrong! The answer is 20.



3rd is 1/3.

1/3rd is 1/(1/3), and therefore 3.

60 divided by 3 is 20.</article>
