    <h1 style="font-size:1.25rem;margin-bottom:1rem;font-family:sans-serif;">English (US) Joke</h1>
    <article style="white-space:pre-wrap;word-break:break-word;">A boy asks his father what a female chicken is called.
His dad answers &quot;A hen, son.&quot;
&quot;And a male chicken?&quot; asks the boy. &quot;They&#x27;re called a rooster.&quot;
&quot;How about a baby chicken?&quot; to which his dad answers &quot;A chick.&quot;
&quot;So dad, what&#x27;s a chicken?&quot;</article>
