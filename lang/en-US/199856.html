    <h1 style="font-size:1.25rem;margin-bottom:1rem;font-family:sans-serif;">English (US) Joke</h1>
    <article style="white-space:pre-wrap;word-break:break-word;">Exam
Joe and Ted finished an exam and talked to each other afterwards.



&quot;I did terrible,&quot; said Joe. &quot;I think I was filling in the wrong bubbles!&quot;



&quot;Me too,&quot; replied Ted.



&quot;Well, why did you do terrible?&quot; asked Joe.



&quot;I forgot to bring a pencil!&quot;</article>
