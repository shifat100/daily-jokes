    <article style="white-space:pre-wrap;word-break:break-word;">New Doctor goes on round at the asylum.
He talks to one man, He ask &quot;Who are you?&quot;

The patient says &quot; I, sir, an Napoleon.&quot;

&quot;How do you know you are Napoleon?&quot; Asks the doctor.

&quot;God told me&quot;, and the next bed over comes, &quot;I did not.&quot;</article>
