    <h1 style="font-size:1.25rem;margin-bottom:1rem;">Bengali (Bangladesh) Joke</h1>
    <article style="white-space:pre-wrap;">দোকানদার: ভাই, কিছু লাগবে?
ক্রেতা: হ্যাঁ, একটু শান্তি লাগবে।
দোকানদার: সেটা আমাদের এখানে নেই।
ক্রেতা: কেন?
দোকানদার: ভাই, এখানে সবকিছুর দাম বাড়ে। শান্তি কিনতে গেলে সেটার দামও বেড়ে যাবে!</article>
