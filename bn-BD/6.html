    <h1 style="font-size:1.25rem;margin-bottom:1rem;">Bengali (Bangladesh) Joke</h1>
    <article style="white-space:pre-wrap;">বন্ধু: তুই ভবিষ্যৎ নিয়ে এত চিন্তা করিস কেন?
আমি: ভবিষ্যৎ তো অনিশ্চিত!
বন্ধু: তাহলে চিন্তা করে লাভ কী?
আমি: ভবিষ্যৎ অনিশ্চিত বলেই চিন্তা করি। নিশ্চিত হলে তো আগেই প্রস্তুতি নিয়ে রাখতাম!</article>
